spring.application.name=invoice-api

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:invoice-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always

security.jwt.secret-key=yourSecretKeyHerewith64charactersminimumforsecuritycheckokay
security.jwt.expiration-time=60000
cors.allowed-origin=http://localhost:4200
logging.level.org.springframework.security=DEBUG
